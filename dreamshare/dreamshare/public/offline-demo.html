<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DreamShare — Your Dreams. Our Community.</title>
<meta name="description" content="Share your dreams, discover meanings with AI, and connect with people who understand."/>
<meta name="theme-color" content="#07070f"/>
<style>
/* ============================================================
   DreamShare — Your Dreams. Our Community.
   Dark moonlit UI · purple accents · mobile app shell
   ============================================================ */

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root{
  --bg:        #06060e;
  --bg-2:      #0a0a18;
  --card:      #12122a;
  --card-2:    #181838;
  --card-3:    #1f1f42;
  --line:      rgba(150,140,255,.14);
  --line-2:    rgba(150,140,255,.25);
  --text:      #f3f1ff;
  --muted:     #9d99c9;
  --muted-2:   #6f6b9a;
  --accent:    #8b7cff;
  --accent-2:  #a78bfa;
  --accent-3:  #6d5cf0;
  --grad:      linear-gradient(135deg,#7c6cf0 0%,#a78bfa 100%);
  --grad-soft: linear-gradient(135deg,rgba(124,108,240,.22),rgba(167,139,250,.14));
  --heart:     #ff4d7d;
  --green:     #5ee6a8;
  --orange:    #ffb86b;
  --radius:    18px;
  --shadow:    0 12px 40px rgba(0,0,0,.45);
  --font:      -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
}

html, body { height: 100%; }
body{
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 800px at 80% -10%, #2a1f56 0%, transparent 55%),
    radial-gradient(900px 700px at -10% 110%, #251a4d 0%, transparent 50%),
    var(--bg);
  display: flex; align-items: center; justify-content: center;
  min-height: 100dvh;
  overflow: hidden;
}
button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, textarea { font-family: inherit; color: inherit; background: none; border: none; outline: none; }
img { display: block; max-width: 100%; }
::-webkit-scrollbar { width: 0; height: 0; }

/* ---------- Stage & phone shell ---------- */
.stage{
  width: 100%; height: 100dvh;
  display: flex; align-items: center; justify-content: center;
}
.phone{
  position: relative;
  width: 100%; height: 100dvh;
  background:
    radial-gradient(700px 420px at 90% -8%, rgba(124,108,240,.20), transparent 55%),
    radial-gradient(600px 500px at -10% 105%, rgba(124,108,240,.14), transparent 55%),
    linear-gradient(180deg,#0a0a16 0%, #07070f 100%);
  overflow: hidden;
  display: flex; flex-direction: column;
}
@media (min-width: 700px){
  .phone{
    width: 392px; height: min(850px, 94dvh);
    border-radius: 46px;
    border: 10px solid #050508;
    box-shadow: 0 30px 80px rgba(0,0,0,.65), 0 0 0 2px #1c1c2e, 0 0 90px rgba(124,108,240,.25);
  }
}

/* ---------- Fake status bar ---------- */
.statusbar{
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 26px 4px;
  font-size: 14px; font-weight: 700; letter-spacing: .2px;
  color: var(--text);
}
.statusbar .sb-icons { display: flex; gap: 6px; align-items: center; }
@media (max-width: 699px){ .statusbar { display: none; } }

.homebar{
  position: absolute; left: 50%; bottom: 7px; transform: translateX(-50%);
  width: 128px; height: 5px; border-radius: 3px;
  background: rgba(255,255,255,.28);
  z-index: 60; pointer-events: none;
}
@media (max-width: 699px){ .homebar { display: none; } }

/* ---------- Viewport & screens ---------- */
.viewport{
  flex: 1 1 auto; min-height: 0;
  position: relative;
  overflow: hidden;
}
.screen{
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  animation: screenIn .28s ease both;
}
@keyframes screenIn{ from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.scroll{
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.pad { padding: 0 18px; }
.pb-nav { padding-bottom: 96px; }
.pb-safe { padding-bottom: 30px; }

/* ---------- App bar ---------- */
.appbar{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px 12px;
  position: relative; z-index: 5;
}
.appbar .title { font-size: 17px; font-weight: 700; }
.appbar .center-title {
  position: absolute; left: 0; right: 0; text-align: center;
  font-size: 17px; font-weight: 700; pointer-events: none;
}
.iconbtn{
  width: 38px; height: 38px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); flex: 0 0 auto;
  transition: background .2s, transform .15s;
}
.iconbtn:active { transform: scale(.92); }
.iconbtn:hover { background: rgba(255,255,255,.06); }
.spacer { flex: 1; }

.brand { display: flex; align-items: center; gap: 9px; }
.brand-name {
  font-size: 21px; font-weight: 800; letter-spacing: .2px;
  background: linear-gradient(90deg,#fff 20%,#cfc6ff 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- Buttons ---------- */
.btn{
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  height: 52px; padding: 0 22px; border-radius: 16px;
  font-size: 16px; font-weight: 700;
  transition: transform .15s, filter .2s, background .2s;
  user-select: none;
}
.btn:active { transform: scale(.97); }
.btn-primary{
  background: var(--grad);
  color: #fff;
  box-shadow: 0 10px 28px rgba(124,108,240,.4);
}
.btn-primary:hover { filter: brightness(1.07); }
.btn-block { width: 100%; }
.btn-ghost{
  background: rgba(255,255,255,.05);
  border: 1px solid var(--line-2);
  color: var(--text);
}
.btn-ghost:hover { background: rgba(255,255,255,.09); }
.btn-dark{
  background: var(--card-2);
  border: 1px solid var(--line);
  color: var(--text);
}
.btn-dark:hover { background: var(--card-3); }
.btn-outline-sm{
  height: 42px; border-radius: 13px; padding: 0 18px;
  border: 1.5px solid var(--line-2);
  font-size: 14.5px; font-weight: 700;
}
.btn[disabled] { opacity: .5; pointer-events: none; }

/* ---------- Chips ---------- */
.chip{
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 14px; border-radius: 999px;
  font-size: 13.5px; font-weight: 600; color: var(--muted);
  background: rgba(255,255,255,.04);
  border: 1px solid var(--line);
  transition: all .18s;
  white-space: nowrap;
}
.chip:hover { border-color: var(--line-2); color: var(--text); }
.chip.on{
  background: var(--grad-soft);
  border-color: rgba(150,130,255,.55);
  color: #dcd6ff;
  box-shadow: 0 4px 16px rgba(124,108,240,.22);
}
.chip.tag {
  height: 30px; padding: 0 12px; font-size: 12.5px;
  border-radius: 999px;
}
.chip.tag.on { background: var(--grad); border-color: transparent; color: #fff; }
.chip-row { display: flex; gap: 9px; flex-wrap: wrap; }
.chip-scroll {
  display: flex; gap: 9px; overflow-x: auto; padding: 2px 18px 2px;
  scrollbar-width: none;
}
.chip-scroll::-webkit-scrollbar { display: none; }

.sect-title {
  font-size: 15.5px; font-weight: 800; margin: 20px 0 12px;
}

/* ---------- Cards ---------- */
.card{
  background: linear-gradient(180deg, rgba(30,28,64,.75), rgba(18,18,42,.85));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
}

/* ---------- Home prompt card ---------- */
.prompt-card{
  background: linear-gradient(180deg, rgba(34,30,72,.8), rgba(18,18,42,.9));
  border: 1px solid var(--line-2);
  border-radius: 20px;
  padding: 16px 16px 14px;
  box-shadow: 0 10px 34px rgba(0,0,0,.35);
}
.prompt-q{
  color: var(--muted);
  font-size: 15px;
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 13px; margin-bottom: 13px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.prompt-q .spark {
  width: 34px; height: 34px; border-radius: 11px; flex: 0 0 auto;
  background: var(--grad-soft);
  display: flex; align-items: center; justify-content: center;
}
.prompt-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.prompt-actions .btn { height: 44px; border-radius: 13px; font-size: 14.5px; }

/* ---------- Feed post ---------- */
.post{
  background: linear-gradient(180deg, rgba(26,24,56,.6), rgba(15,15,36,.75));
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 15px 15px 6px;
  margin-bottom: 14px;
}
.post-head { display: flex; align-items: center; gap: 11px; margin-bottom: 11px; }
.post-head .who { flex: 1; min-width: 0; cursor: pointer; }
.name { font-size: 14.5px; font-weight: 800; }
.handle { font-size: 12px; color: var(--muted-2); margin-top: 1px; }
.time { font-size: 11.5px; color: var(--muted-2); }
.post-tag {
  font-size: 11.5px; font-weight: 700; color: #cfc6ff;
  background: var(--grad-soft);
  border: 1px solid rgba(150,130,255,.35);
  padding: 4px 10px; border-radius: 999px;
  flex: 0 0 auto;
}
.post-text{
  font-size: 14.5px; line-height: 1.55; color: #e7e4ff;
  white-space: pre-wrap; word-break: break-word;
  cursor: pointer;
}
.post-img{
  margin-top: 12px;
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
  aspect-ratio: 16/10;
  background: #0c0c1c;
}
.post-img svg, .post-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post-actions{
  display: flex; align-items: center; gap: 4px;
  margin-top: 8px; padding: 6px 0 10px;
}
.act{
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 11px; border-radius: 12px;
  font-size: 13.5px; font-weight: 700; color: var(--muted);
  transition: transform .15s, color .2s, background .2s;
}
.act:active { transform: scale(.9); }
.act:hover { background: rgba(255,255,255,.05); }
.act.liked { color: var(--heart); }
.act.liked svg { fill: var(--heart); stroke: var(--heart); animation: pop .35s ease; }
.act.saved { color: var(--accent-2); }
.act.saved svg { fill: var(--accent-2); }
@keyframes pop { 0%{transform:scale(.7);} 60%{transform:scale(1.25);} 100%{transform:scale(1);} }
.act svg.wide { stroke: currentColor; fill: none; }

/* ---------- AI promo card ---------- */
.ai-promo{
  display: flex; align-items: center; gap: 13px;
  background:
    radial-gradient(220px 120px at 90% 0%, rgba(167,139,250,.2), transparent 60%),
    linear-gradient(180deg, rgba(32,28,70,.85), rgba(16,16,40,.9));
  border: 1px solid rgba(150,130,255,.3);
  border-radius: 20px;
  padding: 15px;
  margin-bottom: 14px;
  cursor: pointer;
  transition: transform .15s, border-color .2s;
}
.ai-promo:active { transform: scale(.98); }
.ai-promo:hover { border-color: rgba(170,150,255,.55); }
.ai-promo .ic{
  width: 44px; height: 44px; border-radius: 14px; flex: 0 0 auto;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px rgba(124,108,240,.45);
}
.ai-promo .t { font-size: 15px; font-weight: 800; }
.ai-promo .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }

/* ---------- Avatars ---------- */
.avatar{
  border-radius: 50%; overflow: hidden; flex: 0 0 auto;
  border: 2px solid rgba(255,255,255,.1);
  background: var(--card-2);
  position: relative;
}
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar.sm { width: 34px; height: 34px; }
.avatar.md { width: 44px; height: 44px; }
.avatar.lg { width: 86px; height: 86px; border: 3px solid #0a0a16; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
.avatar .dot{
  position: absolute; top: 0; right: 0; width: 11px; height: 11px;
  border-radius: 50%; background: var(--accent-2);
  border: 2px solid var(--bg-2);
}

/* ---------- Bottom tab bar ---------- */
.tabbar{
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 78px;
  display: flex; align-items: stretch;
  background: linear-gradient(180deg, rgba(10,10,24,.55), rgba(8,8,18,.96) 55%);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-top: 1px solid var(--line);
  z-index: 40;
  padding-bottom: 6px;
}
.tabbar.hidden { display: none; }
.tab{
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted-2); font-size: 10.5px; font-weight: 700;
  position: relative;
  transition: color .2s;
}
.tab.on { color: var(--accent-2); }
.tab .badge{
  position: absolute; top: 10px; right: calc(50% - 18px);
  min-width: 15px; height: 15px; border-radius: 8px;
  background: var(--heart); color: #fff;
  font-size: 9px; font-weight: 800;
  display: flex; align-items: center; justify-content: center;
  padding: 0 4px;
  border: 2px solid #0a0a16;
}
.fab-wrap{
  flex: 1; display: flex; align-items: flex-start; justify-content: center;
  position: relative;
}
.fab{
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  margin-top: -14px;
  box-shadow: 0 12px 30px rgba(124,108,240,.55), 0 0 0 6px rgba(10,10,24,.9);
  transition: transform .18s;
}
.fab:active { transform: scale(.9); }

/* ---------- Splash ---------- */
.splash-art{
  position: absolute; inset: 0; overflow: hidden;
}
.splash-art svg { width: 100%; height: 100%; object-fit: cover; }
.splash-content{
  position: relative; z-index: 2;
  display: flex; flex-direction: column; align-items: center;
  flex: 1; min-height: 0; height: 100%;
  padding: 68px 28px 34px;
  text-align: center;
  background: linear-gradient(180deg, rgba(5,5,14,.25) 0%, rgba(5,5,14,0) 30%, rgba(5,5,14,.35) 70%, rgba(5,5,14,.85) 100%);
}
.splash-logo { filter: drop-shadow(0 0 26px rgba(167,139,250,.55)); animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(-8px);} }
.splash-title {
  font-size: 42px; font-weight: 900; letter-spacing: .5px; margin-top: 18px;
  background: linear-gradient(180deg,#ffffff,#d7cfff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: 0 0 50px rgba(167,139,250,.35);
}
.splash-sub {
  font-size: 17px; font-weight: 700; color: #d9d2ff; margin-top: 8px;
}
.splash-desc {
  font-size: 13.5px; line-height: 1.6; color: rgba(230,225,255,.75);
  margin-top: 14px; max-width: 270px;
}
.splash-bottom { margin-top: auto; width: 100%; max-width: 330px; }
.splash-bottom .btn { height: 56px; border-radius: 18px; font-size: 17px; }
.linkline {
  margin-top: 16px; font-size: 13.5px; color: rgba(230,225,255,.75);
}
.linkline b { color: #cfc6ff; cursor: pointer; }
.linkline b:hover { text-decoration: underline; }

/* ---------- Auth ---------- */
.auth-wrap{
  display: flex; flex-direction: column;
  padding: 8px 24px 34px;
}
.auth-brand { display: flex; flex-direction: column; align-items: center; margin: 18px 0 22px; }
.auth-brand .brand-name { font-size: 30px; margin-top: 12px; }
.auth-welcome { text-align: center; margin-bottom: 26px; }
.auth-welcome h2 { font-size: 21px; font-weight: 800; }
.auth-welcome p { font-size: 13.5px; color: var(--muted); margin-top: 5px; }

.field {
  display: flex; align-items: center; gap: 12px;
  height: 54px; padding: 0 16px;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--line);
  border-radius: 15px;
  margin-bottom: 13px;
  transition: border-color .2s, background .2s;
}
.field:focus-within { border-color: rgba(150,130,255,.6); background: rgba(150,130,255,.07); }
.field svg { flex: 0 0 auto; color: var(--muted-2); }
.field input { flex: 1; font-size: 15px; color: var(--text); min-width: 0; }
.field input::placeholder { color: var(--muted-2); }
.field .eye { color: var(--muted-2); cursor: pointer; display: flex; }

.forgot {
  text-align: right; font-size: 12.5px; color: var(--muted);
  margin: 2px 2px 18px; cursor: pointer;
}
.forgot:hover { color: var(--accent-2); }

.orline {
  display: flex; align-items: center; gap: 14px;
  color: var(--muted-2); font-size: 12.5px; font-weight: 700;
  margin: 20px 0;
}
.orline::before, .orline::after {
  content: ""; flex: 1; height: 1px; background: var(--line);
}

.oauth { display: flex; flex-direction: column; gap: 12px; }
.oauth .btn { font-size: 15px; font-weight: 700; }

.guest-line {
  margin-top: auto; padding-top: 26px; text-align: center;
}
.guest-btn {
  width: 100%; height: 48px; border-radius: 15px;
  border: 1.5px dashed rgba(150,130,255,.4);
  color: #cfc6ff; font-size: 14.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: background .2s;
}
.guest-btn:hover { background: rgba(150,130,255,.08); }
.auth-switch { margin-top: 18px; font-size: 13.5px; color: var(--muted); text-align: center; }
.auth-switch b { color: var(--accent-2); cursor: pointer; }
.auth-switch b:hover { text-decoration: underline; }

/* ---------- Share screen ---------- */
.seg {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 10px;
  margin: 4px 0 18px;
}
.seg .btn {
  height: 46px; border-radius: 14px; font-size: 14.5px;
  background: rgba(255,255,255,.045); border: 1px solid var(--line); color: var(--muted);
}
.seg .btn.on {
  background: var(--grad); border-color: transparent; color: #fff;
  box-shadow: 0 8px 22px rgba(124,108,240,.4);
}

.ta-wrap{
  background: rgba(255,255,255,.045);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  transition: border-color .2s;
}
.ta-wrap:focus-within { border-color: rgba(150,130,255,.55); }
.ta-wrap textarea{
  width: 100%; min-height: 130px; resize: none;
  font-size: 16px; line-height: 1.55; color: var(--text);
}
.ta-wrap textarea::placeholder { color: var(--muted-2); }

/* Voice mode */
.voice-wrap{
  display: flex; flex-direction: column; align-items: center;
  background: rgba(255,255,255,.045);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 26px 16px 18px;
}
.mic-orb{
  width: 92px; height: 92px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 14px 40px rgba(124,108,240,.5);
  position: relative;
  transition: transform .15s;
}
.mic-orb:active { transform: scale(.93); }
.mic-orb.rec {
  background: linear-gradient(135deg,#f0567c,#ff8fab);
  box-shadow: 0 14px 40px rgba(255,77,125,.45);
  animation: micPulse 1.4s ease-in-out infinite;
}
@keyframes micPulse{
  0%,100% { box-shadow: 0 14px 40px rgba(255,77,125,.45), 0 0 0 0 rgba(255,77,125,.4); }
  50%     { box-shadow: 0 14px 40px rgba(255,77,125,.45), 0 0 0 18px rgba(255,77,125,0); }
}
.mic-hint { margin-top: 14px; font-size: 13px; color: var(--muted); text-align: center; }
.mic-time { font-size: 15px; font-weight: 800; color: var(--accent-2); margin-top: 6px; font-variant-numeric: tabular-nums; }
.wave { display: flex; gap: 4px; align-items: flex-end; height: 26px; margin-top: 10px; }
.wave i {
  width: 4px; border-radius: 3px; background: var(--accent-2);
  animation: wv 1s ease-in-out infinite; opacity: .8;
}
.wave i:nth-child(1){ height: 8px;  animation-delay: 0s; }
.wave i:nth-child(2){ height: 18px; animation-delay: .15s; }
.wave i:nth-child(3){ height: 12px; animation-delay: .3s; }
.wave i:nth-child(4){ height: 22px; animation-delay: .45s; }
.wave i:nth-child(5){ height: 10px; animation-delay: .6s; }
.wave i:nth-child(6){ height: 16px; animation-delay: .75s; }
.wave i:nth-child(7){ height: 8px;  animation-delay: .9s; }
@keyframes wv { 0%,100%{ transform: scaleY(.55);} 50%{ transform: scaleY(1);} }
.wave.idle i { animation: none; height: 6px !important; opacity: .3; }

.transcript {
  margin-top: 14px;
}
.transcript textarea{
  width: 100%; min-height: 80px; resize: none;
  font-size: 15px; line-height: 1.5;
  background: rgba(0,0,0,.25); border: 1px solid var(--line);
  border-radius: 14px; padding: 12px;
}

/* Photo mode */
.photo-drop{
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px;
  border: 1.5px dashed rgba(150,130,255,.4);
  border-radius: 18px;
  padding: 34px 16px;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  transition: background .2s;
}
.photo-drop:hover { background: rgba(150,130,255,.06); }
.photo-preview {
  border-radius: 18px; overflow: hidden; border: 1px solid var(--line-2);
  position: relative;
}
.photo-preview img { width: 100%; max-height: 260px; object-fit: cover; }
.photo-preview .rm {
  position: absolute; top: 10px; right: 10px;
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,.6); color: #fff;
  display: flex; align-items: center; justify-content: center;
}

/* Feelings */
.feel-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px 8px;
}
.feel {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  padding: 10px 4px; border-radius: 16px;
  border: 1.5px solid transparent;
  transition: all .18s;
}
.feel:hover { background: rgba(255,255,255,.04); }
.feel .em {
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 23px;
  background: rgba(255,255,255,.06);
  border: 1px solid var(--line);
  transition: all .18s;
}
.feel span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.feel.on { border-color: rgba(150,130,255,.6); background: rgba(150,130,255,.1); }
.feel.on .em { background: var(--grad); border-color: transparent; transform: scale(1.06); box-shadow: 0 8px 20px rgba(124,108,240,.4); }
.feel.on span { color: #dcd6ff; }

.bottom-cta{
  flex: 0 0 auto;
  padding: 12px 18px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(8,8,18,0), rgba(8,8,18,.9) 40%);
  position: relative; z-index: 6;
}

/* ---------- AI interpretation ---------- */
.ai-hero{
  border-radius: 22px; overflow: hidden;
  border: 1px solid rgba(150,130,255,.3);
  background: radial-gradient(400px 220px at 50% 0%, rgba(124,108,240,.35), transparent 70%), #10102a;
  padding: 18px 16px 20px;
  text-align: center;
}
.ai-hero svg { width: 148px; height: 118px; margin: 0 auto; display: block; }
.ai-hero h2 { font-size: 19px; font-weight: 800; margin-top: 8px; }
.ai-hero p { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-top: 8px; }

.ai-loading {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 30px; text-align: center; gap: 18px;
}
.ai-steps { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; }
.ai-step {
  display: flex; align-items: center; gap: 10px;
  font-size: 13.5px; color: var(--muted-2);
  opacity: .35; transition: all .4s;
}
.ai-step.done { opacity: 1; color: var(--text); }
.ai-step .tick { color: var(--green); }

.ai-section{
  display: flex; gap: 13px;
  background: linear-gradient(180deg, rgba(28,26,60,.7), rgba(16,16,38,.8));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 15px;
  margin-bottom: 12px;
  animation: rise .5s ease both;
}
.ai-section:nth-child(2){ animation-delay: .08s; }
.ai-section:nth-child(3){ animation-delay: .16s; }
.ai-section:nth-child(4){ animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.ai-section .ic{
  width: 38px; height: 38px; border-radius: 12px; flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}
.ai-section .t { font-size: 14.5px; font-weight: 800; }
.ai-section .b { font-size: 13.5px; line-height: 1.55; color: var(--muted); margin-top: 5px; }

/* ---------- Comments ---------- */
.cs-post {
  padding: 0 18px 14px;
  border-bottom: 1px solid var(--line);
}
.cs-count-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px 10px;
}
.cs-count-row h3 { font-size: 15.5px; font-weight: 800; }
.comment {
  display: flex; gap: 11px;
  padding: 12px 18px;
}
.comment .body { flex: 1; min-width: 0; }
.comment .top { display: flex; align-items: baseline; gap: 8px; }
.comment .top .name { font-size: 13.5px; }
.comment .top .handle { font-size: 11px; }
.comment .top .time { margin-left: auto; font-size: 11px; flex: 0 0 auto; }
.comment .txt {
  font-size: 13.5px; line-height: 1.5; color: #e4e0ff;
  margin-top: 4px; word-break: break-word;
}
.comment .sub {
  display: flex; align-items: center; gap: 16px; margin-top: 7px;
  font-size: 12px; font-weight: 700; color: var(--muted-2);
}
.comment .sub button { display: inline-flex; align-items: center; gap: 6px; color: inherit; font-size: 12px; font-weight: 700; }
.comment .sub button:active { transform: scale(.92); }
.comment .sub button.liked { color: var(--heart); }
.comment .sub button.liked svg { fill: var(--heart); stroke: var(--heart); }

.comment-bar{
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: rgba(8,8,18,.85);
  backdrop-filter: blur(14px);
}
.comment-bar .inp {
  flex: 1; height: 46px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 18px;
  font-size: 15px;
  min-width: 0;
}
.comment-bar .inp::placeholder { color: var(--muted-2); }
.send {
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
  box-shadow: 0 8px 20px rgba(124,108,240,.45);
  transition: transform .15s;
}
.send:active { transform: scale(.9); }

/* ---------- Profile ---------- */
.cover {
  height: 148px; position: relative; overflow: hidden;
}
.cover svg { width: 100%; height: 100%; object-fit: cover; }
.cover::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(6,6,14,.15), rgba(6,6,14,.75));
}
.profile-top {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 22px;
  margin-top: -46px; position: relative; z-index: 2;
}
.profile-top .name { font-size: 20px; font-weight: 900; margin-top: 10px; }
.profile-top .handle { font-size: 13px; }
.profile-top .bio {
  font-size: 13px; color: var(--muted); text-align: center;
  margin-top: 8px; line-height: 1.5;
}
.stats {
  display: flex; justify-content: center; gap: 34px;
  margin: 16px 0;
}
.stat { text-align: center; }
.stat .n { font-size: 17px; font-weight: 900; }
.stat .l { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; font-weight: 600; }
.profile-cta { display: flex; gap: 10px; width: 100%; margin-bottom: 6px; }
.profile-cta .btn-primary { flex: 1; height: 46px; border-radius: 14px; font-size: 15px; }
.dots-btn {
  width: 46px; height: 46px; border-radius: 14px;
  background: var(--card-2); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
}
.ptabs {
  display: flex; margin-top: 12px;
  border-bottom: 1px solid var(--line);
}
.ptab {
  flex: 1; text-align: center; padding: 13px 0;
  font-size: 14.5px; font-weight: 700; color: var(--muted-2);
  border-bottom: 2px solid transparent;
  transition: all .2s;
}
.ptab.on { color: var(--text); border-color: var(--accent-2); }

.mini-post {
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.mini-post .head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.mini-post .txt { font-size: 14px; line-height: 1.5; color: #e7e4ff; cursor: pointer; }
.mini-post .foot { display: flex; align-items: center; margin-top: 6px; }

.about-card { margin: 16px 18px; }
.about-card p { font-size: 14px; line-height: 1.6; color: var(--muted); margin-top: 8px; }
.about-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-top: 12px; }

/* ---------- Notifications ---------- */
.notif {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  cursor: pointer;
  transition: background .18s;
}
.notif:hover { background: rgba(255,255,255,.035); }
.notif:active { background: rgba(255,255,255,.06); }
.notif .body { flex: 1; min-width: 0; }
.notif .t { font-size: 13.5px; line-height: 1.45; color: var(--muted); }
.notif .t b { color: var(--text); font-weight: 800; }
.notif .quote {
  font-size: 12.5px; color: var(--muted-2); font-style: italic;
  margin-top: 4px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.notif .time { font-size: 11px; color: var(--muted-2); margin-top: 4px; }
.notif .chev { color: var(--muted-2); flex: 0 0 auto; }
.notif.unread .body::before {
  content: ""; display: inline-block;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent-2); margin-right: 7px;
  vertical-align: 2px;
}
.notif-ai .tile {
  width: 44px; height: 44px; border-radius: 14px; flex: 0 0 auto;
  background: var(--grad);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px rgba(124,108,240,.45);
}

/* ---------- Explore ---------- */
.searchbar {
  display: flex; align-items: center; gap: 11px;
  height: 48px; padding: 0 16px;
  background: rgba(255,255,255,.05);
  border: 1px solid var(--line);
  border-radius: 999px;
  margin: 4px 0 6px;
}
.searchbar svg { color: var(--muted-2); flex: 0 0 auto; }
.searchbar input { flex: 1; font-size: 15px; min-width: 0; }
.searchbar input::placeholder { color: var(--muted-2); }

.cat-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
}
.cat {
  position: relative;
  aspect-ratio: 1 / 1.08;
  border-radius: 16px; overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
  transition: transform .15s;
}
.cat:active { transform: scale(.95); }
.cat svg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cat .lbl {
  position: absolute; left: 8px; bottom: 8px; z-index: 2;
  font-size: 11.5px; font-weight: 800;
  text-shadow: 0 2px 8px rgba(0,0,0,.8);
}
.cat::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 45%, rgba(5,5,12,.78));
}

.trend-card{
  background: linear-gradient(180deg, rgba(26,24,56,.6), rgba(15,15,36,.75));
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin-bottom: 12px;
  cursor: pointer;
}

/* ---------- Empty / skeleton ---------- */
.empty {
  text-align: center; padding: 50px 30px; color: var(--muted);
}
.empty .big { font-size: 40px; margin-bottom: 12px; }
.empty p { font-size: 14px; line-height: 1.6; }

/* ---------- Toast ---------- */
.toast{
  position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 20px);
  background: rgba(28,26,58,.95);
  border: 1px solid var(--line-2);
  color: var(--text);
  font-size: 13.5px; font-weight: 700;
  padding: 12px 20px; border-radius: 999px;
  opacity: 0; pointer-events: none;
  transition: all .3s;
  z-index: 100;
  box-shadow: var(--shadow);
  white-space: nowrap; max-width: 88%;
  overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- Modal (share sheet) ---------- */
.sheet-wrap{
  position: absolute; inset: 0; z-index: 90;
  background: rgba(4,4,10,.6);
  backdrop-filter: blur(4px);
  display: flex; align-items: flex-end;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.sheet{
  width: 100%;
  background: linear-gradient(180deg,#1b1840,#12122a);
  border: 1px solid var(--line-2);
  border-radius: 24px 24px 0 0;
  padding: 14px 18px calc(22px + env(safe-area-inset-bottom));
  animation: sheetUp .28s ease;
}
@keyframes sheetUp { from{ transform: translateY(40px); opacity:.5 } to{ transform: none; opacity:1 } }
.sheet h4 { font-size: 15px; font-weight: 800; text-align: center; margin-bottom: 14px; }
.sheet-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; }
.sheet-act {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  font-size: 11.5px; color: var(--muted); font-weight: 700;
}
.sheet-act .ic {
  width: 52px; height: 52px; border-radius: 16px;
  background: rgba(255,255,255,.06); border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}

/* ---------- Utils ---------- */
.row { display: flex; align-items: center; }
.dim { color: var(--muted); }
.tiny { font-size: 12px; }
.divider { height: 1px; background: var(--line); margin: 6px 0; }
.hidden { display: none !important; }

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<script>
/* ============================================================

const Scenes = (() => {

  const stars = (n, seed = 1, w = 400, h = 250) => {
    let s = '';
    let x = (seed * 9301 + 49297) % 233280;
    const rnd = () => { x = (x * 9301 + 49297) % 233280; return x / 233280; };
    for (let i = 0; i < n; i++) {
      const cx = (rnd() * w).toFixed(1), cy = (rnd() * h * 0.7).toFixed(1);
      const r = (rnd() * 1.3 + 0.4).toFixed(2), o = (rnd() * 0.7 + 0.25).toFixed(2);
      s += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" opacity="${o}"/>`;
    }
    return s;
  };

  const moon = (cx, cy, r, gid, big = true) => `
    <defs>

        <stop offset="0%" stop-color="#ffe9c9" stop-opacity=".9"/>
        <stop offset="35%" stop-color="#f7c98a" stop-opacity=".35"/>

    <circle cx="${cx - r * 0.3}" cy="${cy - r * 0.25}" r="${r * 0.16}" fill="#d9a86c" opacity=".45"/>
    <circle cx="${cx + r * 0.25}" cy="${cy + r * 0.2}" r="${r * 0.11}" fill="#d9a86c" opacity=".4"/>
    <circle cx="${cx + r * 0.05}" cy="${cy - r * 0.42}" r="${r * 0.07}" fill="#d9a86c" opacity=".35"/>`;

  /* ---------- Brand logo (crescent + sparkles) ---------- */
  const logo = (size = 54) => `
  <svg width="${size}" height="${size}" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="lg1" x1="0" y1="0" x2="64" y2="64">
        <stop offset="0%" stop-color="#c9bcff"/>
        <stop offset="100%" stop-color="#7c6cf0"/>

    </defs>
    <path d="M38.5 8.5c-11.8 1.6-21 11.7-21 24 0 13.2 10.8 24 24 24 3.2 0 6.2-.6 9-1.8C45 60.5 37.6 64 29 64 14.6 64 3 52.4 3 38 3 21.5 17.2 8.2 33.4 8c1.7 0 3.4.2 5.1.5z" fill="url(#lg1)"/>

    <path d="M50 30l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z" fill="#a78bfa"/>
  </svg>`;

  /* ---------- Splash landscape ---------- */
  const splash = () => `
  <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="spSky" x1="0" y1="0" x2="0" y2="800">
        <stop offset="0%" stop-color="#1a1040"/>
        <stop offset="35%" stop-color="#3b2168"/>
        <stop offset="62%" stop-color="#7a3f7e"/>
        <stop offset="82%" stop-color="#c96a8e"/>
        <stop offset="100%" stop-color="#2a1638"/>

      <radialGradient id="spCl" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffb6c9" stop-opacity=".85"/>
        <stop offset="100%" stop-color="#ffb6c9" stop-opacity="0"/>

    <rect width="400" height="800" fill="url(#spSky)"/>
    ${stars(38, 7, 400, 380)}
    ${moon(200, 405, 58, 'sp')}
    <g opacity=".8">
      <ellipse cx="70" cy="470" rx="130" ry="34" fill="#d989a8" opacity=".55"/>
      <ellipse cx="320" cy="505" rx="150" ry="38" fill="#c96a9a" opacity=".5"/>
      <ellipse cx="150" cy="545" rx="180" ry="42" fill="#a8558c" opacity=".55"/>
      <ellipse cx="330" cy="585" rx="160" ry="40" fill="#7e3f78" opacity=".6"/>
      <ellipse cx="60" cy="615" rx="150" ry="38" fill="#5b2f66" opacity=".65"/>
    </g>
    <ellipse cx="200" cy="405" rx="150" ry="150" fill="url(#spCl)" opacity=".35"/>
    <!-- cliff -->
    <path d="M0 800 L0 640 Q60 620 110 635 Q150 645 175 668 L205 700 L240 720 L300 738 L400 752 L400 800 Z" fill="#140a22"/>
    <path d="M0 800 L0 700 Q80 685 140 705 L210 745 L300 768 L400 775 L400 800 Z" fill="#0a0614"/>
    <!-- sitting person silhouette -->
    <g fill="#05030c">
      <ellipse cx="128" cy="632" rx="9" ry="10"/>
      <path d="M118 642 q10 -6 20 0 l6 24 -32 2 z"/>
      <path d="M120 662 l30 0 14 16 -10 6 -30 -6 z"/>
    </g>
  </svg>`;

  /* ---------- Dream scenes ---------- */
  const forest = (u) => `
  <svg viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="fSky${u}" x1="0" y1="0" x2="0" y2="250">

    <rect width="400" height="250" fill="url(#fSky${u})"/>
    ${stars(12, 3, 400, 120)}
    <!-- far trees -->
    <g fill="#0a2018" opacity=".9">

      <path d="M300 250 L318 80 L336 250 Z"/><path d="M335 250 L352 100 L369 250 Z"/>

    <g fill="#04120c">
      <path d="M-10 250 L30 40 L72 250 Z"/><path d="M28 250 L58 25 L92 250 Z"/>
      <path d="M330 250 L368 35 L410 250 Z"/><path d="M305 250 L340 55 L375 250 Z"/>
      <rect x="24" y="150" width="10" height="100" rx="3"/>
      <rect x="360" y="145" width="11" height="105" rx="3"/>

    { re: /\b(wedding|marriage|bride|groom|married|marry|love|kiss|crush|partner)\b/i,
      label: 'Love / wedding (union)', meaning: 'desire for connection and commitment — or coming into balance with yourself',
      theme: 'love, commitment, connection' },
    { re: /\b(money|cash|coins?|gold|rich|treasure|poor)\b/i,
      label: 'Money (self-worth)', meaning: 'self-worth, opportunity and how you value your own energy',
      theme: 'self-worth, opportunity, anxiety' },
    { re: /\b(storm|thunder|lightning|flood|hurricane|tornado)\b/i,
      label: 'Storm (emotional release)', meaning: 'emotional turbulence that is building up and asking to be released',
      theme: 'tension, release, change' },
    { re: /\b(mirror|reflection|shadow)\b/i,
      label: 'Mirror / shadow (the self)', meaning: 'how you see yourself — and parts of you that want to be acknowledged',
      theme: 'self-image, awareness' },
    { re: /\b(dog|cat|puppy|kitten|pet|animal|bird)\b/i,
      label: 'Animal (instinct)', meaning: 'your instincts — loyalty, comfort or a habit asking for attention',
      theme: 'instinct, comfort, loyalty' },
    { re: /\b(moon)\b/i,
      label: 'Moon (intuition)', meaning: 'your intuition and inner cycles — trust your gut right now',
      theme: 'intuition, cycles, femininity' },
    { re: /\b(night|dark|darkness|black)\b/i,
      label: 'Darkness (the unknown)', meaning: 'the unknown — your mind working through something you can\'t fully see yet',
      theme: 'uncertainty, the unconscious' },
    { re: /\b(beach|sand|island|mountain|cliff|hill|climbing)\b/i,
      label: 'Landscape (life path)', meaning: 'your wider life path — where you feel stuck and where you\'re headed',
      theme: 'ambition, journey, perspective' },
    { re: /\b(blood|injury|hurt|wound|accident|crying|tears)\b/i,
      label: 'Hurt / tears (emotional pain)', meaning: 'emotional pain that wants attention and compassion',
      theme: 'vulnerability, healing' },
  ];

  const FEEL_MOD = {
    Happy:   { mood: 'hopeful and positive', theme: 'joy, contentment' },
    Sad:     { mood: 'reflective and a little heavy', theme: 'sadness, loss, reflection' },
    Scared:  { mood: 'anxious and alert', theme: 'fear, anxiety, caution' },
    Excited: { mood: 'energized and open to change', theme: 'excitement, possibility' },
    Confused:{ mood: 'uncertain and searching for answers', theme: 'confusion, searching' },
    Calm:    { mood: 'peaceful and grounded', theme: 'peace, balance' },
    Angry:   { mood: 'charged with frustration', theme: 'anger, boundaries' },
    Other:   { mood: 'unusual and hard to label', theme: 'mystery, complexity' }
  };

  const TAG_MOD = {
    Nightmare: 'Because it felt like a nightmare, your brain may be stress-processing fears from the day.',
    Lucid: 'Being lucid shows strong self-awareness — you were observing your own mind at work.',
    Romantic: 'The romantic tone points to a wish for closeness, warmth or self-acceptance.',
    Strange: 'Strange dreams often mix memories in new ways while you sleep.',
    Recurring: 'Recurring dreams return until something they point to is fully felt or resolved.'
  };

  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  function matchSymbols(text) {
    const found = [];
    for (const s of SYMBOLS) {
      const m = text.match(s.re);
      if (m) found.push({ ...s, phrase: m[0] });
    }
    return found;
  }

  function sceneFor(text) {
    const found = matchSymbols(text);
    for (const s of found) if (s.scene) return s.scene;
    return 'mist';
  }

  /* --------- Public: dream → interpretation object --------- */
  function interpretDream(text, feeling, tags = []) {
    const t = text || '';
    const found = matchSymbols(t);
    const feel = FEEL_MOD[feeling] || FEEL_MOD.Other;
    const tagNotes = tags.map(x => TAG_MOD[x]).filter(Boolean);

    /* Key Symbols */
    let symbolsLine;
    if (found.length) {
      symbolsLine = found.slice(0, 4).map(s => s.label).join(', ');
    } else {
      symbolsLine = (feeling ? feeling + ' feelings' : 'everyday symbols') +
        ' (personal to your life right now)';
    }

    /* Emotional Themes */
    const themes = new Set();
    found.slice(0, 3).forEach(s => s.theme.split(',').map(x => x.trim()).forEach(x => themes.add(x)));
    feel.theme.split(',').map(x => x.trim()).forEach(x => themes.add(x));
    const themeList = [...themes].slice(0, 3).join(', ');

    /* Possible Meaning */
    let meaning;
    if (found.length >= 2) {
      meaning = `Your dream seems to center on ${found[0].meaning} combined with ${found[1].meaning}. ` +
        `Overall it points to ${feel.theme.split(',')[0]} — you may be processing something quietly in the background.`;
    } else if (found.length === 1) {
      meaning = `At its heart, this dream suggests ${found[0].meaning}. ` +
        `The ${found[0].phrase.toLowerCase()} imagery often shows up when you are navigating ${feel.theme.split(',')[0]}.`;
    } else {
      meaning = `This dream reads like a reflection of your inner state — ${feel.mood}. ` +
        `Even without classic symbols, the storyline mirrors something your mind has been carrying lately.`;
    }

    /* Common Interpretations */
    let common = 'You might be going through a transition or feeling overwhelmed, but there is hope ahead. ' +
      'Small steps in waking life can help this feeling settle.';
    if (found.length) {
      common = `A common reading of ${found[0].label.toLowerCase()} is that you are in a period of ${themeList.split(',')[0] || 'change'}. ` +
        (tagNotes[0] || `Your ${feeling ? feeling.toLowerCase() : 'mixed'} feeling suggests ${feel.mood}.`);
    } else if (tagNotes[0]) {
      common = tagNotes[0];
    }

    return {
      headline: "Here's what your dream might mean...",
      disclaimer: "Keep in mind, dream interpretation isn't a science, but it can offer helpful insights and perspectives.",
      sections: [
        { icon: '😊', bg: 'rgba(255,184,107,.15)', title: 'Possible Meaning', body: meaning },
        { icon: '🌸', bg: 'rgba(255,125,170,.15)', title: 'Emotional Themes', body: themeList.charAt(0).toUpperCase() + themeList.slice(1) },
        { icon: '🔍', bg: 'rgba(124,108,240,.18)', title: 'Key Symbols', body: symbolsLine },
        { icon: '👁️', bg: 'rgba(94,230,168,.15)', title: 'Common Interpretations', body: common }
      ],
      symbols: found.map(f => f.label),
      scene: sceneFor(t)
    };
  }

  return { interpretDream, sceneFor, pick };
})();

    const a = user(d.authorId);
    const img = d.photo
      ? `<div class="post-img"><img src="${d.photo}" alt="dream art"/></div>`
      : (d.scene ? `<div class="post-img">${Scenes.scene(d.scene, d.id)}</div>` : '');
    return `
    <article class="post" data-id="${d.id}">
      <div class="post-head">
        ${av(a, 'md')}
        <div class="who" data-act="profile" data-id="${a.id}">
          <div class="name">${esc(a.name)}</div>
          <div class="handle">@${esc(a.handle)} · ${timeAgo(d.timeMin)}</div>
        </div>
        <span class="post-tag">${esc(d.tag)}</span>
      </div>
      <div class="post-text" data-act="comments" data-id="${d.id}">${esc(d.text)}</div>

        <button class="act ${d.likedByMe ? 'liked' : ''}" data-act="like" data-id="${d.id}" aria-label="Like">${I.heart}<span>${d.likes}</span></button>

  function feedList() {
    let list = [...S.dreams];
    if (S.feedTab === 'trending') list.sort((a, b) => b.likes - a.likes);
    else if (S.feedTab === 'recent') list.sort((a, b) => a.timeMin - b.timeMin);
    else if (S.feedTab === 'following') list = list.filter(d => S.following.includes(d.authorId) || d.authorId === (S.me && S.me.id));
    else list.sort((a, b) => a.timeMin - b.timeMin);
    return list;
  }

  function screenHome() {
    const list = feedList();
    const tabs = [['for-you', 'For You'], ['trending', 'Trending'], ['recent', 'Recent'], ['following', 'Following']];
    const items = list.length
      ? list.map((d, i) => (i === 0 ? postCard(d) + aiPromo() : postCard(d))).join('')
      : `<div class="empty"><div class="big">🌙</div><p>No dreams here yet.<br/>Share yours and light up this feed!</p></div>`;
    return `
    <div class="screen">
      <div class="appbar">
        <div class="brand">${Scenes.logo(32)}<span class="brand-name">DreamShare</span></div>
        <span class="spacer"></span>
        <button class="iconbtn" data-act="tab" data-s="explore" aria-label="Search">${I.search}</button>
        <button class="iconbtn" data-act="profile" data-id="me" aria-label="Profile" style="padding:0;width:38px">
          ${av(S.me, 'sm')}
        </button>
      </div>
      <div class="scroll pb-nav">
        <div class="pad">
          <div class="prompt-card">
            <div class="prompt-q" data-act="share-mode" data-m="text">
              <span class="spark">${I.spark}</span>
              <span>What did you dream last night?</span>
            </div>
            <div class="prompt-actions">
              <button class="btn btn-ghost" data-act="share-mode" data-m="text">${I.typeSm} Type</button>
              <button class="btn btn-ghost" data-act="share-mode" data-m="voice">${I.micSm} Voice</button>
            </div>
          </div>
          <div style="height:14px"></div>
          <div class="chip-row" style="margin-bottom:14px">
            ${tabs.map(([k, l]) => `<button class="chip ${S.feedTab === k ? 'on' : ''}" data-act="feedtab" data-k="${k}">${l}</button>`).join('')}
          </div>
          ${items}
        </div>
      </div>
    </div>`;
  }

  function aiPromo() {
    return `
    <div class="ai-promo" data-act="share-mode" data-m="text">
      <div class="ic">${I.spark}</div>
      <div><div class="t">Get AI Interpretation</div><div class="s">Discover what your dream might mean</div></div>
    </div>`;
  }

  function screenShare() {
    const d = S.draft;
    let modeUi = '';
    if (d.mode === 'text') {
      modeUi = `<div class="ta-wrap"><textarea id="dream-text" placeholder="Describe your dream...&#10;e.g. I was in a big ocean, then a whale came to me...">${esc(d.text)}</textarea></div>`;
    } else if (d.mode === 'voice') {
      const rec = S.rec;
      modeUi = `
      <div class="voice-wrap">
        <button class="mic-orb ${rec.on ? 'rec' : ''}" data-act="mic" aria-label="Record">${I.mic}</button>
        <div class="mic-hint">${rec.on ? 'Listening… tap to stop' : 'Tap the mic and speak your dream'}</div>
        <div class="mic-time">${String(Math.floor(rec.sec / 60)).padStart(2, '0')}:${String(rec.sec % 60).padStart(2, '0')}</div>
        <div class="wave ${rec.on ? '' : 'idle'}"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="transcript"><textarea id="dream-text" placeholder="Your words will appear here... you can also edit them.">${esc(d.text)}</textarea></div>
      </div>`;
    } else {
      modeUi = d.photo
        ? `<div class="photo-preview"><img src="${d.photo}" alt="Your dream photo"/>
             <button class="rm" data-act="rm-photo">✕</button></div>
           <div style="height:12px"></div>
           <div class="ta-wrap"><textarea id="dream-text" placeholder="Say something about this dream...">${esc(d.text)}</textarea></div>`
        : `<label class="photo-drop" for="photo-input">
             ${I.photoSm}
             <b>Add a dream photo</b>
             <span class="tiny dim">Tap to choose from gallery</span>
           </label>
           <input id="photo-input" type="file" accept="image/*" class="hidden"/>`;
    }

    const feels = [['Happy', '😊'], ['Sad', '😢'], ['Scared', '😨'], ['Excited', '🤩'], ['Confused', '😕'], ['Calm', '😌'], ['Angry', '😠'], ['Other', '🌀']];
    const tags = ['Nightmare', 'Lucid', 'Romantic', 'Strange', 'Recurring', 'Other'];

    return `
    <div class="screen">
      <div class="appbar">
        <button class="iconbtn" data-act="back">${I.back}</button>
        <div class="center-title">Share Your Dream</div>
        <span class="spacer"></span>
      </div>
      <div class="scroll pad pb-safe">
        <div class="seg">
          <button class="btn ${d.mode === 'text' ? 'on' : ''}" data-act="draft-mode" data-m="text">${I.typeSm} Text</button>
          <button class="btn ${d.mode === 'voice' ? 'on' : ''}" data-act="draft-mode" data-m="voice">${I.micSm} Voice</button>

        </div>
        ${modeUi}
        <h3 class="sect-title">How did you make you feel?</h3>
        <div class="feel-grid">
          ${feels.map(([k, e]) => `
            <button class="feel ${d.feeling === k ? 'on' : ''}" data-act="feel" data-k="${k}">
              <span class="em">${e}</span><span>${k}</span>
            </button>`).join('')}
        </div>
        <h3 class="sect-title">Tags (optional)</h3>
        <div class="chip-row">
          ${tags.map(t => `<button class="chip tag ${d.tags.includes(t) ? 'on' : ''}" data-act="tag" data-k="${t}">${t}</button>`).join('')}
        </div>
        <div style="height:20px"></div>
      </div>
      <div class="bottom-cta">
        <button class="btn btn-primary btn-block" data-act="to-ai">Post Dream</button>
      </div>
    </div>`;
  }

    const a = user(d.authorId);
    const cs = [...d.comments];
    if (p.sort === 'new') cs.sort((x, y) => x.timeMin - y.timeMin);
    else cs.sort((x, y) => y.likes - x.likes);

    return `
    <div class="screen">
      <div class="appbar">
        <button class="iconbtn" data-act="back">${I.back}</button>
        <div class="center-title">Comments</div>
      </div>
      <div class="scroll">
        <div class="cs-post">
          <div class="post-head">
            ${av(a, 'md')}
            <div class="who" data-act="profile" data-id="${a.id}">
              <div class="name">${esc(a.name)}</div>
              <div class="handle">@${esc(a.handle)} · ${timeAgo(d.timeMin)}</div>
            </div>
            <span class="post-tag">${esc(d.tag)}</span>
          </div>
          <div class="post-text">${esc(d.text)}</div>
          <div class="post-actions">
            <button class="act ${d.likedByMe ? 'liked' : ''}" data-act="like" data-id="${d.id}">${I.heart}<span>${d.likes}</span></button>

            <span class="spacer"></span>
            <button class="act ${d.saved ? 'saved' : ''}" data-act="save" data-id="${d.id}">${I.save}</button>

        </div>

        </div>
        ${cs.length ? cs.map(c => {
          const cu = user(c.userId);
          return `
          <div class="comment">
            ${av(cu, 'sm')}
            <div class="body">
              <div class="top">
                <span class="name">${esc(cu.name)}</span>
                <span class="handle">@${esc(cu.handle)}</span>
                <span class="time">${timeAgo(c.timeMin)}</span>
              </div>
              <div class="txt">${esc(c.text)}</div>
              <div class="sub">

                <button data-act="reply" data-id="${cu.handle}">${I.reply} Reply</button>
              </div>
            </div>
          </div>`;
        }).join('') : `<div class="empty"><div class="big">💬</div><p>Be the first to comment<br/>on this dream.</p></div>`}
        <div style="height:10px"></div>
      </div>
      <div class="comment-bar">
        <input class="inp" id="comment-input" placeholder="Add a comment..." value="${esc(S.commentDraft)}"/>
        <button class="send" data-act="send-comment" data-id="${d.id}" aria-label="Send">${I.send}</button>
      </div>
    </div>`;
  }

    const uid = p.id === 'me' ? S.me.id : p.id;

    const isMe = uid === S.me.id;
    const mine = S.dreams.filter(d => d.authorId === uid);
    const following = S.following.includes(uid);
    const isSeeded = SEED_USERS.some(x => x.id === uid);
    const dreamsCount = mine.length + (isSeeded ? 22 : 0);

    const cta = isMe
      ? `<button class="btn btn-outline-sm" style="flex:1" data-act="share-mode" data-m="text">+ Share a dream</button>
         <button class="dots-btn" data-act="edit-profile">${I.dots}</button>`
      : `<button class="btn ${following ? 'btn-ghost' : 'btn-primary'}" style="flex:1;height:46px;border-radius:14px;font-size:15px" data-act="follow" data-id="${uid}">${following ? 'Following ✓' : 'Follow'}</button>
         <button class="dots-btn" data-act="more">${I.dots}</button>`;

    return `
    <div class="screen">
      <div class="appbar" style="position:absolute;left:0;right:0;top:0;z-index:5;background:linear-gradient(180deg,rgba(5,5,12,.5),transparent)">
        <button class="iconbtn" data-act="${S.stack.length > 1 ? 'back' : 'tab'}" data-s="home">${I.back}</button>
        <span class="spacer"></span>
        <button class="iconbtn" data-act="more">${I.dots}</button>
      </div>
      <div class="scroll pb-nav">

            <div class="stat"><div class="n">${u.following || 0}</div><div class="l">Following</div></div>
          </div>
          <div class="profile-cta">${cta}</div>
        </div>
        <div class="ptabs">
          <button class="ptab ${S.profileTab === 'dreams' ? 'on' : ''}" data-act="ptab" data-k="dreams">Dreams</button>

               <div class="name">About ${esc(u.name)}</div>
               <p>${esc(u.bio)}</p>
               <div class="about-row">${I.cal} Joined March 2025</div>
               <div class="about-row">${I.link} ${esc(u.handle)}@dreamshare</div>
               <div style="height:8px"></div>
               <div class="chip-row">
                 <span class="chip tag on">🌙 Dreamer</span>
                 <span class="chip tag">Lucid</span>
                 <span class="chip tag">Nature</span>
               </div>
             </div>`}
      </div>
    </div>`;

  function screenNotifications() {
    const tabs = [['all', 'All'], ['likes', 'Likes'], ['comments', 'Comments'], ['follows', 'Follows']];
    let list = S.notifs;
    if (S.notifTab !== 'all') list = list.filter(n => n.type === S.notifTab);

    const row = (n) => {
      const u = n.userId ? user(n.userId) : null;
      const tile = n.type === 'ai'
        ? `<div class="notif-ai"><div class="tile">${I.spark}</div></div>`
        : av(u, 'md');
      const body = n.type === 'ai'
        ? `<div class="t"><b>${esc(n.text)}</b></div>${n.sub ? `<div class="quote">${esc(n.sub)}</div>` : ''}`
        : `<div class="t"><b>${esc(u.name)}</b> ${esc(n.text)}</div>${n.quote ? `<div class="quote">${esc(n.quote)}</div>` : ''}`;
      return `
      <div class="notif ${n.unread ? 'unread' : ''} ${n.type === 'ai' ? 'notif-ai' : ''}" data-act="open-notif" data-id="${n.id}">
        ${tile}
        <div class="body">
          ${body}
          <div class="time">${timeAgo(n.timeMin)}</div>
        </div>
        <span class="chev">${I.chev}</span>
      </div>`;
    };

    return `
    <div class="screen">
      <div class="appbar"><div class="title" style="font-size:21px;font-weight:900;padding-left:6px">Notifications</div></div>
      <div class="chip-scroll" style="padding-bottom:12px">
        ${tabs.map(([k, l]) => `<button class="chip ${S.notifTab === k ? 'on' : ''}" data-act="notif-tab" data-k="${k}">${l}</button>`).join('')}
      </div>
      <div class="scroll pb-nav">
        ${list.length ? list.map(row).join('') : `<div class="empty"><div class="big">🔔</div><p>Nothing here yet.</p></div>`}
      </div>
    </div>`;
  }

  function screenExplore() {
    const q = S.search.trim().toLowerCase();
    const cats = [
      ['Nightmare', 'nightmare'], ['Lucid', 'lucid'], ['Romantic', 'romantic'],
      ['Strange', 'strange'], ['Recurring', 'recurring'], ['Spiritual', 'spiritual']
    ];
    const trending = [...S.dreams].sort((a, b) => b.likes - a.likes);

    let results = '';
    if (q) {
      const hits = S.dreams.filter(d =>
        d.text.toLowerCase().includes(q) ||
        d.tag.toLowerCase().includes(q) ||
        user(d.authorId).name.toLowerCase().includes(q) ||
        user(d.authorId).handle.toLowerCase().includes(q)
      );
      results = `
        <h3 class="sect-title">Results for “${esc(S.search)}” (${hits.length})</h3>
        <div id="explore-results">
          ${hits.length ? hits.map(miniPost).join('') : `<div class="empty"><div class="big">🔍</div><p>No dreams found.<br/>Try another word or tag.</p></div>`}
        </div>`;
    } else {
      results = `
        <h3 class="sect-title">Popular Categories</h3>
        <div class="cat-grid">
          ${cats.map(([label, key]) => `
            <div class="cat" data-act="category" data-k="${label}">
              ${Scenes.catArt[key]('ex' + key)}
              <span class="lbl">${label}</span>
            </div>`).join('')}
        </div>
        <h3 class="sect-title">Trending Dreams</h3>
        <div id="explore-results">
          ${trending.map(d => `
            <div class="trend-card" data-act="comments" data-id="${d.id}">
              <div class="post-head" style="margin-bottom:8px">
                ${av(user(d.authorId), 'sm')}
                <div class="who" data-act="profile" data-id="${d.authorId}">
                  <div class="name">${esc(user(d.authorId).name)}</div>
                  <div class="handle">@${esc(user(d.authorId).handle)}</div>
                </div>
                <span class="post-tag">${esc(d.tag)}</span>
              </div>
              <div class="post-text">${esc(d.text)}</div>
              <div class="post-actions">
                <span class="act ${d.likedByMe ? 'liked' : ''}" style="padding-left:0">${I.heart}<span>${d.likes}</span></span>
                <span class="act">${I.comment}<span>${d.comments.length}</span></span>
              </div>
            </div>`).join('')}
        </div>`;
    }

    return `
    <div class="screen">
      <div class="appbar"><div class="title" style="font-size:21px;font-weight:900;padding-left:6px">Explore</div></div>
      <div class="scroll pb-nav pad">
        <div class="searchbar">
          ${I.search}
          <input id="search-input" type="text" placeholder="Search dreams, users, tags..." value="${esc(S.search)}"/>
        </div>
        ${results}
        <div style="height:14px"></div>
      </div>
    </div>`;
  }

  function screenCategory(p) {
    const k = p.k;
    const kw = {
      Nightmare: ['scared', 'lost', 'fear', 'dark', 'death', 'disappear', "couldn't find", 'monster', 'chased'],
      Lucid: ['flying', 'fly', 'float', 'floating', 'flew', 'sky'],
      Romantic: ['love', 'kiss', 'wedding', 'bride'],
      Strange: ['whale', 'ocean', 'floating', 'door', 'snake', 'strange', 'deep'],
      Recurring: ['exam', 'school', 'again', 'answer sheet'],
      Spiritual: ['light', 'stars', 'star', 'moon', 'grandfather', 'grandmother', 'peaceful', 'spirit']
    }[k] || [];
    const hits = S.dreams.filter(d => {
      const t = (d.text + ' ' + d.tag).toLowerCase();
      return d.tag.toLowerCase().includes(k.toLowerCase()) || kw.some(w => t.includes(w));
    });
    return `
    <div class="screen">
      <div class="appbar">
        <button class="iconbtn" data-act="back">${I.back}</button>
        <div class="center-title">${esc(k)} Dreams</div>
      </div>
      <div class="scroll pb-nav pad">
        ${hits.length ? hits.map(miniPost).join('') : `<div class="empty"><div class="big">🌀</div><p>No “${esc(k)}” dreams yet.<br/>Be the first to share one!</p></div>`}
      </div>
    </div>`;
  }

  function screenShareSheet(p) {
    const d = dream(p.id);
    const link = `https://dreamshare.app/d/${p.id}`;
    return `
    <div class="screen">
      <div class="scroll pad">${postCard(d)}</div>
      <div class="sheet-wrap" data-act="close-sheet">
        <div class="sheet" data-stop="1">
          <h4>Share this dream</h4>
          <div class="sheet-grid">
            <button class="sheet-act" data-act="share-native" data-id="${p.id}"><span class="ic">↗️</span>Share</button>
            <button class="sheet-act" data-act="copy-link" data-l="${link}"><span class="ic">🔗</span>Copy link</button>
            <button class="sheet-act" data-act="share-wa"><span class="ic">💬</span>WhatsApp</button>
            <button class="sheet-act" data-act="close-sheet"><span class="ic">✖️</span>Close</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  /* ---------------- Tab bar ---------------- */
  function renderTabbar() {
    const scr = top().s;
    const showOn = ['home', 'explore', 'notifs', 'profile'];
    const show = (S.stack.length === 1 && showOn.includes(scr));
    $tabbar.classList.toggle('hidden', !show);
    if (!show) return;

    const u = unreadCount();
    const item = (s, icon, label) => `
      <button class="tab ${scr === s ? 'on' : ''}" data-act="tab" data-s="${s}">
        ${icon}<span>${label}</span>
        ${s === 'notifs' && u ? `<span class="badge">${u}</span>` : ''}
      </button>`;
    $tabbar.innerHTML = `
      ${item('home', I.home, 'Home')}
      ${item('explore', I.compass, 'Explore')}
      <div class="fab-wrap"><button class="fab" data-act="share-mode" data-m="text" aria-label="Share dream">${I.plus}</button></div>
      ${item('notifs', I.bell, 'Notifications')}
      ${item('profile', I.person, 'Profile')}`;
  }

  /* ---------------- Render ---------------- */
  function render() {
    const t = top();
    let html = '';
    switch (t.s) {
      case 'splash': html = screenSplash(); break;
      case 'auth': html = screenAuth(); break;
      case 'home': html = screenHome(); break;
      case 'share': html = screenShare(); break;
      case 'ai': html = screenAI(); break;
      case 'comments': html = screenComments(t); break;
      case 'profile': html = screenProfile(t); break;
      case 'notifs': html = screenNotifications(); break;
      case 'explore': html = screenExplore(); break;
      case 'category': html = screenCategory(t); break;
      case 'sheet': html = screenShareSheet(t); break;
      default: html = screenSplash();
    }
    $app.innerHTML = html;
    renderTabbar();
    bindInputs();
  }

  /* Keep focus-friendly input bindings */
  function bindInputs() {
    const ta = document.getElementById('dream-text');
    if (ta) {
      ta.addEventListener('input', () => { S.draft.text = ta.value; });
    }
    const ci = document.getElementById('comment-input');
    if (ci) {
      ci.addEventListener('input', () => { S.commentDraft = ci.value; });
    }
    const si = document.getElementById('search-input');
    if (si) {
      si.addEventListener('input', () => {
        S.search = si.value;
        // partial re-render keeps keyboard focus
        const scroll = si.closest('.screen').querySelector('.scroll');
        const active = document.activeElement === si;
        render();
        if (active) {
          const s2 = document.getElementById('search-input');
          if (s2) { s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
        }
        void scroll;
      });
    }
    const pi = document.getElementById('photo-input');
    if (pi) {
      pi.addEventListener('change', () => {
        const f = pi.files && pi.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => { S.draft.photo = r.result; render(); toast('Photo added 📸'); };
        r.readAsDataURL(f);
      });
    }
  }

  /* ---------------- Voice ---------------- */
  const DEMO_LINES = [
    'I was walking on a beach at night and the waves were glowing blue. Then I saw a door standing in the sand.',
    'I dreamt that I was late for a train, but the train waited for me the whole time.',
    'A big snake was following me through my old school, but it turned into a river.'
  ];

  function startRec() {
    S.rec.on = true; S.rec.sec = 0;
    recTimer = setInterval(() => {
      S.rec.sec++;
      const el = document.querySelector('.mic-time');
      if (el) el.textContent = `${String(Math.floor(S.rec.sec / 60)).padStart(2, '0')}:${String(S.rec.sec % 60).padStart(2, '0')}`;
    }, 1000);

    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      try {
        recog = new SR();
        recog.continuous = true; recog.interimResults = true; recog.lang = 'en-IN';
        let base = S.draft.text ? S.draft.text + ' ' : '';
        recog.onresult = (e) => {
          let finalT = '';
          for (let i = e.resultIndex; i < e.results.length; i++) {
            if (e.results[i].isFinal) finalT += e.results[i][0].transcript;
          }
          if (finalT) {
            S.draft.text = (base + finalT).trim();
            base = S.draft.text + ' ';
            const ta = document.getElementById('dream-text');
            if (ta) ta.value = S.draft.text;
          }
        };
        recog.onerror = () => { };
        recog.start();
      } catch (e) { recog = null; }
    }
    render();
  }

  function stopRec(silent) {
    if (recTimer) { clearInterval(recTimer); recTimer = null; }
    if (recog) { try { recog.stop(); } catch (e) { } recog = null; }
    if (!S.rec.on) return;
    const wasSec = S.rec.sec;
    S.rec.on = false;
    // demo fallback if nothing was captured
    if (!S.draft.text.trim() && wasSec >= 1 && !silent) {
      S.draft.text = DreamAI.pick(DEMO_LINES);
      toast('Demo transcript added 🎙️');
    }
    if (!silent) render();
  }

  /* ---------------- Actions ---------------- */
  const actions = {
    back,
    'go-auth-login': () => { S.authMode = 'login'; go('auth'); },
    'go-auth-signup': () => { S.authMode = 'signup'; go('auth'); },
    'toggle-auth': () => { S.authMode = S.authMode === 'login' ? 'signup' : 'login'; render(); },
    'toggle-pw': () => {
      const f = document.getElementById('f-pw');
      if (f) f.type = f.type === 'password' ? 'text' : 'password';
    },
    forgot: () => toast('Password reset link sent (demo)'),
    login: () => {
      const id = (document.getElementById('f-id') || {}).value || '';
      const pw = (document.getElementById('f-pw') || {}).value || '';
      if (!id.trim() || !pw.trim()) { toast('Email/phone aur password daalo ✍️'); return; }
      const nm = id.split('@')[0].split(/[._\-\d]/).filter(Boolean)[0] || 'Dreamer';
      S.me = {
        id: 'me',
        name: nm.charAt(0).toUpperCase() + nm.slice(1),
        handle: (id.split('@')[0] || 'dreamer').toLowerCase().replace(/\s/g, '') + '_dreams',
        hue: 265,
        bio: 'Dreamer | Explorer | Believer in better tomorrows 🌙',
        followers: 42, following: S.following.length,
        guest: false
      };
      switchTab('home'); toast(`Welcome, ${S.me.name}! 🌙`); save();
    },
    oauth: (el) => {
      const p = el.dataset.p;
      S.me = {
        id: 'me', name: 'Saurabh', handle: 'saurabh_dreams', hue: 220,
        bio: 'Dreamer | Explorer | Believer in better tomorrows',
        followers: 42, following: S.following.length, guest: false
      };
      switchTab('home'); toast(`${p} se welcome back! 🌙`); save();
    },
    guest: () => {
      S.me = {
        id: 'me', name: 'Guest Dreamer', handle: 'guest_dreamer', hue: 280,
        bio: 'Just exploring dreams as a guest 🌙✨', followers: 0, following: 0, guest: true
      };
      switchTab('home'); toast('Guest mode me swagat hai! 🌙'); save();
    },
    tab: (el) => {
      const s = el.dataset.s;
      if (s === 'profile') {
        S.profileTab = 'dreams';
        cleanupTransients();
        S.stack = [{ s: 'profile', id: 'me' }];
        render(); return;
      }
      switchTab(s);
    },
    feedtab: (el) => { S.feedTab = el.dataset.k; render(); },
    'notif-tab': (el) => { S.notifTab = el.dataset.k; render(); },
    ptab: (el) => { S.profileTab = el.dataset.k; render(); },
    'share-mode': (el) => {
      S.draft.mode = el.dataset.m || 'text';
      if (S.rec.on) stopRec(true);
      go('share');
    },
    'draft-mode': (el) => {
      S.draft.mode = el.dataset.m;
      if (S.rec.on) stopRec(true);
      render();
    },
    feel: (el) => { S.draft.feeling = S.draft.feeling === el.dataset.k ? null : el.dataset.k; render(); },
    tag: (el) => {
      const k = el.dataset.k;
      const i = S.draft.tags.indexOf(k);
      if (i >= 0) S.draft.tags.splice(i, 1); else S.draft.tags.push(k);
      render();
    },
    'rm-photo': () => { S.draft.photo = null; render(); },
    mic: () => { if (S.rec.on) stopRec(); else startRec(); },

    'to-ai': () => {
      const d = S.draft;
      const txt = (d.text || '').trim();
      if (!txt && !d.photo) { toast('Pehle apna dream likho ya bolo 🌙'); return; }
      S.aiBusy = true; S.interpretation = null;
      go('ai');
      const steps = document.querySelectorAll('.ai-step');
      steps.forEach((el, i) => setTimeout(() => el.classList.add('done'), 350 + i * 420));
      setTimeout(() => {
        S.interpretation = DreamAI.interpretDream(txt, d.feeling, d.tags);
        if (d.photo) S.interpretation.scene = null;
        S.aiBusy = false;
        render();
      }, 2200);
    },

    'post-dream': () => {
      const d = S.draft;
      const txt = (d.text || '').trim() || '(A dream told in a picture 🌙)';
      const tag = d.tags.length ? '#' + d.tags[0] : (d.feeling ? '#' + d.feeling : '#Dream');
      const nd = {
        id: 'd' + Date.now(),
        authorId: S.me.id,
        timeMin: 0,
        tag,
        text: txt,
        scene: d.photo ? null : (S.interpretation ? S.interpretation.scene : 'mist'),
        photo: d.photo,
        likes: 0, likedByMe: false, saved: false,
        comments: []
      };
      S.dreams.unshift(nd);
      S.notifs.unshift({
        id: 'n' + Date.now(), type: 'ai', userId: null, timeMin: 0,
        text: 'You have a new AI interpretation',
        sub: 'for your dream: “' + txt.slice(0, 34) + (txt.length > 34 ? '...' : '') + '”',
        target: nd.id, unread: true
      });
      S.draft = { text: '', mode: 'text', feeling: null, tags: [], photo: null };
      S.interpretation = null;
      S.feedTab = 'for-you';
      switchTab('home');
      toast('Dream posted! ✨');
      save();
    },

    like: (el) => {
      const d = dream(el.dataset.id);
      if (!d) return;
      d.likedByMe = !d.likedByMe;
      d.likes += d.likedByMe ? 1 : -1;
      render(); save();
    },
    save: (el) => {
      const d = dream(el.dataset.id);
      if (!d) return;
      d.saved = !d.saved;
      toast(d.saved ? 'Saved to your collection 🔖' : 'Removed from saved');
      render(); save();
    },
    comments: (el) => { S.commentDraft = ''; go('comments', { id: el.dataset.id, sort: 'top' }); },
    sort: (el) => { top().sort = el.dataset.k; render(); },
    'like-comment': (el) => {
      const d = dream(el.dataset.id);
      const c = d && d.comments.find(x => x.id === el.dataset.cid);
      if (!c) return;
      c.likedByMe = !c.likedByMe;
      c.likes += c.likedByMe ? 1 : -1;
      render(); save();
    },
    reply: (el) => {
      S.commentDraft = '@' + el.dataset.id + ' ';
      render();
      const ci = document.getElementById('comment-input');
      if (ci) ci.focus();
    },
    'send-comment': (el) => {
      const d = dream(el.dataset.id);
      const ci = document.getElementById('comment-input');
      const v = (ci && ci.value || S.commentDraft || '').trim();
      if (!d || !v) { toast('Comment likho pehle ✍️'); return; }
      d.comments.unshift({
        id: 'c' + Date.now(), userId: S.me.id, timeMin: 0,
        text: v, likes: 0, likedByMe: false
      });
      S.commentDraft = '';
      top().sort = 'new';
      render(); toast('Comment added 💬'); save();
    },

    profile: (el) => {
      const id = el.dataset.id === 'me' ? S.me.id : el.dataset.id;
      S.profileTab = 'dreams';
      go('profile', { id });
    },
    follow: (el) => {
      const id = el.dataset.id;
      const i = S.following.indexOf(id);
      const u = user(id);
      if (i >= 0) { S.following.splice(i, 1); if (u.followers) u.followers--; toast('Unfollowed'); }
      else { S.following.push(id); if (u.followers) u.followers++; toast('Following ' + u.name + ' ✓'); }
      render(); save();
    },
    more: () => toast('More options (demo)'),
    'edit-profile': () => toast('Profile editing (demo)'),

    'open-notif': (el) => {
      const n = S.notifs.find(x => x.id === el.dataset.id);
      if (!n) return;
      n.unread = false;
      save();
      if (n.type === 'follows' || n.target === 'profile') {
        S.profileTab = 'dreams';
        go('profile', { id: n.userId });
      } else if (n.target && dream(n.target)) {
        go('comments', { id: n.target, sort: 'top' });
      } else render();
    },

    category: (el) => go('category', { k: el.dataset.k }),

    share: (el) => go('sheet', { id: el.dataset.id }),
    'close-sheet': (el, ev) => {
      if (el.classList.contains('sheet-wrap') && ev.target.closest('.sheet') && !ev.target.closest('[data-act="close-sheet"]')) return;
      back();
    },
    'share-native': (el) => {
      const d = dream(el.dataset.id);
      const text = `🌙 DreamShare — ${user(d.authorId).name}'s dream:\n"${d.text}"`;
      if (navigator.share) {
        navigator.share({ title: 'DreamShare', text, url: location.href }).catch(() => { });
      } else {
        copy(text);
        toast('Dream copied — share anywhere! ↗️');
      }
      back();
    },
    'copy-link': (el) => { copy(el.dataset.l); toast('Link copied! 🔗'); back(); },
    'share-wa': () => {
      const t = encodeURIComponent('Dekho yeh dream 🌙 DreamShare par:');
      window.open(`https://wa.me/?text=${t}`, '_blank');
      back();
    }
  };

  function copy(t) {
    try {
      navigator.clipboard.writeText(t);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = t; document.body.appendChild(ta);
      try { ta.select(); document.execCommand('copy'); } catch (e2) { }
      ta.remove();
    }
  }

  /* ---------------- Global events ---------------- */
  $app.addEventListener('click', (ev) => {
    const el = ev.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;
    if (el.dataset.stop) return;
    if (actions[act]) { ev.preventDefault(); actions[act](el, ev); }
  });

  /* ---------------- Boot ---------------- */
  function init() {
    const had = load();
    if (had && S.me) {
      // continue where we left: straight to home if logged in
      S.stack = [{ s: 'home' }];
    } else {
      seed();
    }
    render();
  }

  init();
  return { S };
})();

</script>
</body>
</html>
